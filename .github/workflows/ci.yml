name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web exec playwright-core install --with-deps chromium --only-shell
      - run: pnpm --dir web test:e2e
      - run: git diff --exit-code -- web/dist
      - run: go test ./...
      - run: go vet ./...
      - run: go -C .ai-factory/rules test ./...
      - run: go -C .ai-factory/rules build -o checkrules .
      - run: ./.ai-factory/rules/checkrules --root . all
